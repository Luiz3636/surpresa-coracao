
<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Encontra o Coração ❤️</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 16px;
  font-family: Arial, sans-serif;
  background: linear-gradient(140deg, #ffe0eb, #eae2ff);
  color: #713c59;
}

.game {
  width: 100%;
  max-width: 420px;
  padding: 24px 16px;
  border-radius: 25px;
  text-align: center;
  background: white;
  box-shadow: 0 12px 35px #9d568b25;
}

h1 { font-size: 27px; }

#message {
  min-height: 48px;
  line-height: 1.5;
}

.board {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin: 28px 0;
}

.card {
  flex: 1;
  min-width: 0;
  max-width: 110px;
  height: 145px;
  border: 3px solid white;
  border-radius: 16px;
  background: linear-gradient(145deg, #e85a94, #bd4e99);
  color: white;
  font-size: 40px;
  box-shadow: 0 5px 0 #d6a1bf;
  cursor: pointer;
  transition: transform 0.4s ease;
  touch-action: manipulation;
}

.card.revealed {
  background: white;
  color: #713c59;
  border-color: #efb2cc;
  box-shadow: 0 5px 0 #e6c0d0;
}

.card:disabled {
  opacity: 1;
  cursor: default;
}

.main-button {
  width: 100%;
  padding: 15px;
  border: 0;
  border-radius: 14px;
  background: #e84d88;
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
  margin-top: 8px;
}

.main-button:disabled { opacity: 0.6; }
.hidden { display: none; }
.small { font-size: 13px; color: #966b83; }
.heart-big { font-size: 65px; }
</style>
</head>

<body>
<main class="game" id="game">
  <h1>Encontra o Coração ❤️</h1>
  <p id="level">Nível 1 de 5</p>
  <p id="message">
    Memoriza onde está o Coração. Depois segue a carta!
  </p>

  <div class="board" id="board">
    <button class="card" data-symbol="❤️" disabled>❤️</button>
    <button class="card" data-symbol="❄️" disabled>❄️</button>
    <button class="card" data-symbol="☀️" disabled>☀️</button>
  </div>

  <button class="main-button" id="start">
    Começar a baralhar!
  </button>

  <button class="main-button hidden" id="next">
    Próximo nível ❤️
  </button>

  <p class="small">Feito especialmente para ti 💗</p>
</main>

<script>
const game = document.getElementById("game");
const board = document.getElementById("board");
const message = document.getElementById("message");
const levelText = document.getElementById("level");
const startButton = document.getElementById("start");
const nextButton = document.getElementById("next");

let cardOrder = [...document.querySelectorAll(".card")];
let level = 1;
let busy = false;
let won = false;
let started = false;

function hideCard(card) {
  card.textContent = "";
  card.classList.remove("revealed");
}

function hideAllCards() {
  cardOrder.forEach(hideCard);
}

function showAllCards() {
  cardOrder.forEach(card => {
    card.textContent = card.dataset.symbol;
    card.classList.add("revealed");
  });
}

function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

async function swapCards(a, b, speed) {
  const first = cardOrder[a];
  const second = cardOrder[b];

  const firstRect = first.getBoundingClientRect();
  const secondRect = second.getBoundingClientRect();
  const distance = secondRect.left - firstRect.left;

  first.style.transition = `transform ${speed}ms ease`;
  second.style.transition = `transform ${speed}ms ease`;

  first.style.transform = `translateX(${distance}px)`;
  second.style.transform = `translateX(${-distance}px)`;

  await sleep(speed);

  // Troca os próprios elementos de posição.
  // Os símbolos continuam escondidos.
  [cardOrder[a], cardOrder[b]] =
    [cardOrder[b], cardOrder[a]];

  cardOrder.forEach(card => board.appendChild(card));

  cardOrder.forEach(card => {
    card.style.transition = "none";
    card.style.transform = "none";
  });

  void board.offsetWidth;

  cardOrder.forEach(card => {
    card.style.transition = "transform 0.4s ease";
  });

  await sleep(60);
}

async function shuffle() {
  if (busy || won || started) return;

  busy = true;
  started = true;

  startButton.disabled = true;
  cardOrder.forEach(card => card.disabled = true);

  // As cartas ficam viradas para baixo antes de começar.
  hideAllCards();

  message.textContent = "Segue a carta do Coração! ❤️";

  const swaps = 3 + level * 2;
  const speed = Math.max(280, 500 - level * 35);

  for (let i = 0; i < swaps; i++) {
    // Trocas entre cartas vizinhas para facilitar
    // acompanhar os movimentos.
    const a = Math.floor(Math.random() * 2);
    const b = a + 1;

    await swapCards(a, b, speed);
    await sleep(120);
  }

  // IMPORTANTE: os símbolos NÃO voltam a aparecer.
  // Só serão revelados depois de uma escolha.
  message.textContent = "Em que carta está o Coração? ❤️";

  cardOrder.forEach(card => card.disabled = false);
  busy = false;
}

cardOrder.forEach(card => {
  card.addEventListener("click", async () => {
    if (busy || won || !started) return;

    busy = true;
    cardOrder.forEach(c => c.disabled = true);

    // Revela apenas a carta escolhida.
    card.textContent = card.dataset.symbol;
    card.classList.add("revealed");

    if (card.dataset.symbol === "❤️") {
      won = true;

      message.textContent = level === 5
        ? "Conseguiste chegar ao último nível! ❤️"
        : "Acertaste! Muito bem! 💗";

      nextButton.textContent = level === 5
        ? "Ver a pergunta 💗"
        : "Próximo nível ❤️";

      nextButton.classList.remove("hidden");
      busy = false;
    } else {
      message.textContent =
        "Não é o Coração! Tenta outra carta ❤️";

      await sleep(850);

      // Volta a esconder a carta errada.
      hideCard(card);

      cardOrder.forEach(c => c.disabled = false);
      busy = false;
    }
  });
});

startButton.addEventListener("click", shuffle);

nextButton.addEventListener("click", () => {
  if (level === 5) {
    game.innerHTML = `
      <div class="heart-big">❤️</div>
      <h1>Tenho uma pergunta...</h1>
      <p style="font-size:19px;line-height:1.8">
        Preparei esta surpresa para ti.<br><br>
        E agora quero saber uma coisa...<br><br>
        <strong>Queres namorar comigo? 💗</strong>
      </p>
    `;
    return;
  }

  level++;
  won = false;
  started = false;
  busy = false;

  // Baralha a disposição inicial para o novo nível.
  for (let i = cardOrder.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [cardOrder[i], cardOrder[j]] =
      [cardOrder[j], cardOrder[i]];
  }

  cardOrder.forEach(card => {
    card.style.transition = "none";
    card.style.transform = "none";
    board.appendChild(card);
  });

  showAllCards();

  levelText.textContent = `Nível ${level} de 5`;
  message.textContent =
    "Memoriza onde está o Coração. ❤️";

  nextButton.classList.add("hidden");
  startButton.disabled = false;
  startButton.textContent = "Começar a baralhar!";

  cardOrder.forEach(card => card.disabled = true);
});

showAllCards();
</script>
</body>
</html>
