
<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Encontra o Coração ❤️</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 16px;
  font-family: Arial, sans-serif;
  background: linear-gradient(140deg, #ffe0eb, #eae2ff);
  color: #713c59;
}

.game {
  width: 100%;
  max-width: 420px;
  padding: 24px 16px;
  border-radius: 25px;
  text-align: center;
  background: white;
  box-shadow: 0 12px 35px #9d568b25;
}

h1 { font-size: 27px; }
#message { min-height: 48px; line-height: 1.5; }

.board {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin: 28px 0;
}

.card {
  flex: 1;
  min-width: 0;
  max-width: 110px;
  height: 145px;
  border: 3px solid white;
  border-radius: 16px;
  background: linear-gradient(145deg, #e85a94, #bd4e99);
  color: white;
  font-size: 40px;
  box-shadow: 0 5px 0 #d6a1bf;
  cursor: pointer;
  transition: transform 0.4s ease;
  touch-action: manipulation;
}

.card.revealed {
  background: white;
  color: #713c59;
  border-color: #efb2cc;
  box-shadow: 0 5px 0 #e6c0d0;
}

.main-button {
  width: 100%;
  padding: 15px;
  border: 0;
  border-radius: 14px;
  background: #e84d88;
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
  margin-top: 8px;
}

.main-button:disabled { opacity: 0.6; }
.hidden { display: none; }
.small { font-size: 13px; color: #966b83; }
.heart-big { font-size: 65px; }
</style>
</head>

<body>
<main class="game" id="game">
  <h1>Encontra o Coração ❤️</h1>
  <p id="level">Nível 1 de 5</p>
  <p id="message">
    Memoriza as cartas! Depois, segue o Coração.
  </p>

  <div class="board" id="board">
    <button class="card revealed">❤️</button>
    <button class="card revealed">❄️</button>
    <button class="card revealed">☀️</button>
  </div>

  <button class="main-button" id="start">Começar a baralhar!</button>
  <button class="main-button hidden" id="next">Próximo nível ❤️</button>
  <p class="small">Feito especialmente para ti 💗</p>
</main>

<script>
const game = document.getElementById("game");
const board = document.getElementById("board");
const cards = [...document.querySelectorAll(".card")];
const message = document.getElementById("message");
const levelText = document.getElementById("level");
const startButton = document.getElementById("start");
const nextButton = document.getElementById("next");

let level = 1;
let busy = false;
let won = false;
let order = ["❤️", "❄️", "☀️"];

function drawCards() {
  cards.forEach((card, i) => {
    card.textContent = order[i];
  });
}

function hideSymbols() {
  cards.forEach(card => {
    card.textContent = "";
    card.classList.remove("revealed");
  });
}

function showSymbols() {
  cards.forEach((card, i) => {
    card.textContent = order[i];
    card.classList.add("revealed");
  });
}

function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

async function moveCards(a, b, speed) {
  const first = cards[a];
  const second = cards[b];

  const firstRect = first.getBoundingClientRect();
  const secondRect = second.getBoundingClientRect();
  const distance = secondRect.left - firstRect.left;

  first.style.transition = `transform ${speed}ms ease`;
  second.style.transition = `transform ${speed}ms ease`;

  first.style.transform = `translateX(${distance}px)`;
  second.style.transform = `translateX(${-distance}px)`;

  await sleep(speed);

  [order[a], order[b]] = [order[b], order[a]];

  first.style.transition = "none";
  second.style.transition = "none";
  first.style.transform = "none";
  second.style.transform = "none";

  drawCards();
  hideSymbols();

  void board.offsetWidth;
}

async function shuffle() {
  if (busy || won) return;

  busy = true;
  startButton.disabled = true;
  cards.forEach(card => card.disabled = true);

  message.textContent = "Segue o Coração com os olhos! ❤️";

  // Esconde os símbolos durante o baralhamento.
  hideSymbols();

  const swaps = 2 + level * 2;
  const speed = Math.max(280, 550 - level * 40);

  for (let i = 0; i < swaps; i++) {
    let a = Math.floor(Math.random() * 3);
    let b = Math.floor(Math.random() * 3);

    while (a === b) {
      b = Math.floor(Math.random() * 3);
    }

    await moveCards(a, b, speed);
    await sleep(120);
  }

  // Os símbolos voltam a aparecer no fim.
  showSymbols();

  message.textContent = "Onde está o Coração? Escolhe uma carta!";
  cards.forEach(card => card.disabled = false);
  busy = false;
}

cards.forEach((card, index) => {
  card.addEventListener("click", () => {
    if (busy || won) return;

    if (order[index] === "❤️") {
      won = true;
      cards.forEach(c => c.disabled = true);

      message.textContent = level === 5
        ? "Conseguiste chegar ao último nível! ❤️"
        : "Acertaste! Muito bem! 💗";

      nextButton.textContent = level === 5
        ? "Ver a pergunta 💗"
        : "Próximo nível ❤️";

      nextButton.classList.remove("hidden");
    } else {
      message.textContent = "Quase! Tenta outra vez. Não perdes o nível ❤️";
    }
  });
});

startButton.addEventListener("click", shuffle);

nextButton.addEventListener("click", () => {
  if (level === 5) {
    game.innerHTML = `
      <div class="heart-big">❤️</div>
      <h1>Tenho uma pergunta...</h1>
      <p style="font-size:19px;line-height:1.8">
        Preparei esta surpresa para ti.<br><br>
        E agora quero saber uma coisa...<br><br>
        <strong>Queres namorar comigo? 💗</strong>
      </p>
    `;
    return;
  }

  level++;
  won = false;

  order.sort(() => Math.random() - 0.5);
  drawCards();
  showSymbols();

  levelText.textContent = `Nível ${level} de 5`;
  message.textContent = "Memoriza as cartas! ❤️";

  nextButton.classList.add("hidden");
  startButton.disabled = false;
  startButton.textContent = "Começar a baralhar!";

  cards.forEach(card => card.disabled = false);
});

drawCards();
</script>
</body>
</html>
